version: "3.8"

services:
  jogo-digitacao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jogo_digitacao_infantil
    restart: always
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
